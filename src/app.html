<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32x32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon-16x16.png" type="image/png" sizes="16x16" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="theme-color" content="#7C3AED" />
		<!-- For link previews: crawlers don't run the SPA, so these are static and absolute (§7.1). -->
		<title>Vibe Chess</title>
		<meta
			name="description"
			content="Play chess in your browser, against the computer or a friend."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Vibe Chess" />
		<meta property="og:title" content="Vibe Chess" />
		<meta
			property="og:description"
			content="Play chess in your browser, against the computer or a friend."
		/>
		<meta property="og:url" content="https://chess.gebrev.com/" />
		<meta property="og:image" content="https://chess.gebrev.com/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Vibe Chess: a white pawn on a purple-to-pink tile over a chessboard"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
